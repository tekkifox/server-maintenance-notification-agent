name: Publish and deploy Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The stack is deployed on the vortex host through the self-hosted runner on
  # vortexservers. The runner invokes the host deploy wrapper directly via
  # limited sudo: no tailnet join and no SSH deploy keys. The stack is named
  # after this application.
  deploy:
    name: Deploy the notification agent
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - linux
      - X64
      - vortexservers
    timeout-minutes: 30

    steps:
      - name: Validate the deploy inputs
        env:
          STACKS: vortex-server-maintenance-notification-agent
          ACTION: deploy
        run: |
          set -euo pipefail
          case "$ACTION" in
            deploy|restart) ;;
            *)
              echo "::error::action must be deploy or restart"
              exit 1
              ;;
          esac
          [[ -n "$STACKS" ]] || {
            echo "::error::stacks must not be empty"
            exit 1
          }
          IFS=',' read -r -a stack_list <<< "$STACKS"
          for stack in "${stack_list[@]}"; do
            if [[ ! "$stack" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "::error::invalid stack name '$stack'; names must match ^[a-z0-9][a-z0-9-]*$"
              exit 1
            fi
          done
          echo "Validated: stacks=$STACKS action=$ACTION"

      - name: Deploy the stack on vortex
        env:
          STACKS: vortex-server-maintenance-notification-agent
          ACTION: deploy
        run: |
          set -euo pipefail
          echo "Running: sudo /usr/local/bin/vortex-deploy $STACKS $ACTION"
          sudo /usr/local/bin/vortex-deploy "$STACKS" "$ACTION"
