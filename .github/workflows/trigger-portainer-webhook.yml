name: Trigger Portainer webhook

on:
  workflow_run:
    workflows:
      - Publish Docker image
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

env:
  # Name of the Portainer stack this repository deploys. Stack Id and
  # EndpointId are discovered from the API so they are never hardcoded.
  STACK_NAME: server-maintenance-notification-agent

jobs:
  trigger:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --hostname=gh-server-maintenance-notification-agent-${{ github.run_id }}

      - name: Redeploy Portainer stack via API
        shell: bash
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${PORTAINER_URL:-}" ]; then
            echo "PORTAINER_URL secret is not set" >&2
            exit 1
          fi
          if [ -z "${PORTAINER_API_KEY:-}" ]; then
            echo "PORTAINER_API_KEY secret is not set" >&2
            exit 1
          fi

          PORTAINER_URL="${PORTAINER_URL%/}"

          # Portainer on the tailnet serves a self-signed certificate on :9443,
          # so -k is required. Perform a request and print the body to stdout.
          # Any non-2xx status prints the response body to stderr and fails the step.
          request() {
            local method="$1"
            local url="$2"
            local data="${3:-}"
            local response status body

            if [ -n "${data}" ]; then
              response=$(curl -sSk -X "${method}" "${url}" \
                -H "X-API-Key: ${PORTAINER_API_KEY}" \
                -H "Content-Type: application/json" \
                -d "${data}" \
                -w '\n%{http_code}') || {
                echo "curl failed for ${method} ${url}" >&2
                return 1
              }
            else
              response=$(curl -sSk -X "${method}" "${url}" \
                -H "X-API-Key: ${PORTAINER_API_KEY}" \
                -w '\n%{http_code}') || {
                echo "curl failed for ${method} ${url}" >&2
                return 1
              }
            fi

            status=$(printf '%s\n' "${response}" | tail -n 1)
            body=$(printf '%s\n' "${response}" | sed '$d')

            if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
              echo "Portainer ${method} ${url} failed with HTTP status ${status}" >&2
              printf '%s\n' "${body}" >&2
              return 1
            fi

            printf '%s\n' "${body}"
          }

          # --- Find the stack by name; never hardcode Id or EndpointId ---
          stacks_body=$(request GET "${PORTAINER_URL}/api/stacks")

          stack=$(printf '%s\n' "${stacks_body}" \
            | jq -c --arg name "${STACK_NAME}" '[.[] | select(.Name == $name)][0] // empty')

          if [ -z "${stack}" ]; then
            echo "Portainer stack named '${STACK_NAME}' not found in /api/stacks" >&2
            printf '%s\n' "${stacks_body}" >&2
            exit 1
          fi

          stack_id=$(printf '%s\n' "${stack}" | jq -r '.Id // empty')
          endpoint_id=$(printf '%s\n' "${stack}" | jq -r '.EndpointId // empty')

          if [ -z "${stack_id}" ] || [ "${stack_id}" = "null" ]; then
            echo "Portainer stack '${STACK_NAME}' has no Id" >&2
            printf '%s\n' "${stacks_body}" >&2
            exit 1
          fi
          if [ -z "${endpoint_id}" ] || [ "${endpoint_id}" = "null" ]; then
            echo "Portainer stack '${STACK_NAME}' has no EndpointId" >&2
            printf '%s\n' "${stacks_body}" >&2
            exit 1
          fi

          echo "Found stack '${STACK_NAME}': Id=${stack_id}, EndpointId=${endpoint_id}"

          # --- Read the existing Env from the stack detail ---
          detail_body=$(request GET "${PORTAINER_URL}/api/stacks/${stack_id}")
          env_array=$(printf '%s\n' "${detail_body}" | jq -c '.Env // []')

          # --- Read the currently running stack file to preserve it ---
          file_body=$(request GET "${PORTAINER_URL}/api/stacks/${stack_id}/file")
          stack_file_content=$(printf '%s\n' "${file_body}" | jq -r '.StackFileContent // empty')

          if [ -z "${stack_file_content}" ]; then
            echo "Portainer /api/stacks/${stack_id}/file returned no StackFileContent" >&2
            printf '%s\n' "${file_body}" >&2
            exit 1
          fi

          # --- Redeploy with the unchanged file, existing Env, and a pull ---
          payload=$(jq -n \
            --arg compose "${stack_file_content}" \
            --argjson env "${env_array}" \
            '{StackFileContent: $compose, Env: $env, PullImage: true}')

          request PUT "${PORTAINER_URL}/api/stacks/${stack_id}?endpointId=${endpoint_id}" "${payload}" >/dev/null

          echo "Portainer stack '${STACK_NAME}' redeployed (PUT accepted)"
